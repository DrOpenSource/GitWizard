name: Publish to Open VSX & VS Code Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for Open VSX Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Extension & Webview
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o gitwizard.vsix

      # Open VSX Trusted Publishing (Zero-Token OIDC)
      - name: Publish to Open VSX Registry
        run: npx ovsx publish gitwizard.vsix
