name: CI & Publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for Open VSX Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Extension & Webview
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o gitwizard.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitwizard-vsix
          path: gitwizard.vsix

      # Open VSX Trusted Publishing (Zero-Token OIDC)
      - name: Publish to Open VSX Registry
        if: github.event_name == 'release'
        run: npx ovsx publish gitwizard.vsix
        continue-on-error: true

